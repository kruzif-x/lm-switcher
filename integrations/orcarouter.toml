# OrcaRouter — optional cloud provider entry
# ------------------------------------------------------------------
# OrcaRouter (https://www.orcarouter.ai) is an OpenAI-compatible
# gateway to 200+ models (DeepSeek, GLM, Kimi, Qwen, Claude, GPT,
# Gemini, ...) billed at provider rates with no token markup.
# Optional: it sits alongside LM Switcher's local engines; nothing
# about your local-model workflows changes when you use it.
#
# 1. Get a key:  https://www.orcarouter.ai/ref/ref_a1a2c3f77b1a87bde5f8
#    (referral link — sign-ups through it earn LM Switcher 5% of attributed spend)
# 2. Base URL:   https://api.orcarouter.ai/v1
# 3. Auth:       Authorization: Bearer $ORCA_KEY
# 4. Model id:   anything from  GET https://api.orcarouter.ai/v1/models
#                e.g. "deepseek/deepseek-v4.1-flash", "z-ai/glm-5.3-flash",
#                     "moonshotai/kimi-k3"  — or let "orcarouter/auto" route for you.

# ---- Generic OpenAI-compatible config (most clients) ----
# base_url = "https://api.orcarouter.ai/v1"
# env_key  = "ORCA_KEY"
# model    = "orcarouter/auto"

# ---- Codex CLI (config.toml format) ----
model = "orcarouter/auto"
model_provider = "orcarouter"

[model_providers.orcarouter]
name = "OrcaRouter"
base_url = "https://api.orcarouter.ai/v1"
wire_api = "responses"
env_key = "ORCA_KEY"
